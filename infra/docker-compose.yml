services:
  postgres:
    image: postgres:16-alpine
    container_name: ibiblia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ibiblia
      POSTGRES_PASSWORD: ibiblia
      POSTGRES_DB: ibiblia
    ports:
      - "55432:5432"
    volumes:
      - ibiblia_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibiblia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ibiblia-redis
    restart: unless-stopped
    ports:
      - "63817:6379"
    volumes:
      - ibiblia_redis:/data

  minio:
    image: minio/minio:latest
    container_name: ibiblia-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - ibiblia_minio:/data

volumes:
  ibiblia_pg:
  ibiblia_redis:
  ibiblia_minio:
